name: Patch journey infographic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-journey.yml'
      - 'tools/patch_journey.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Web journey slide
        run: python tools/patch_journey.py
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign Web journey as swimlane infographic'
          git push
