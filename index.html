<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chapter 13 Instrumentation → Observability 2026</title>
<style>html,body{margin:0;background:#08111f;color:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.loading{height:100vh;display:grid;place-items:center;color:#aab9ca;font-size:14px}</style>
<script src="./enhance.js?v=o11y-1"></script>
</head>
<body>
<div class="loading">Loading deck…</div>
<script>
(async()=>{
  const response=await fetch('./base.html?v=o11y-1',{cache:'no-store'});
  if(!response.ok) throw new Error('Unable to load base deck');
  const base=await response.text();
  const html=window.enhanceDeck ? window.enhanceDeck(base) : base;
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div class="loading">Deck load failed: '+String(err.message||err)+'</div>';
  console.error(err);
});
</script>
</body>
</html>
